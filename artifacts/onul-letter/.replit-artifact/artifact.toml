kind = "web"
previewPath = "/"
title = "오늘의 편지"
version = "1.0.0"
id = "artifacts/onul-letter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22103

[services.development]
run = "pnpm --filter @workspace/onul-letter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onul-letter", "run", "build" ]
publicDir = "artifacts/onul-letter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22103"
BASE_PATH = "/"
